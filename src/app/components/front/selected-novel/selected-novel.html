@if (novel(); as n) {
  <div class="card text-center w-50">
    <div class="card-header">Auteur: {{ n.author }}</div>
    <div class="card-body">
      <h5 class="card-title" [class.text-primary]="n.isNew">{{ n.title | uppercase }}</h5>
      <p class="card-text">Catégorie: {{ n.category }}</p>
      <p class="card-text">Prix: {{ n.price }} DT</p>
    </div>
    <div class="card-footer">
      <button class="btn btn-dark me-2" (click)="onBackToNovels()">Retour</button>
      <button class="btn btn-danger" (click)="onDeleteNovel(n.id)">Supprimer</button>
    </div>
  </div>
} @else {
  <p>Ce roman n'existe pas</p>
  <button class="btn btn-dark" (click)="onBackToNovels()">Retour</button>
}
